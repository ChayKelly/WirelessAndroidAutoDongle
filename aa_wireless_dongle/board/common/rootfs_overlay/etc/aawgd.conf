#!/bin/sh

######## Configuration options for Android Auto Wireless Dongle ########

## Country code (ISO/IEC 3166-1)
## Set the regulatory domain for the wifi network. This will help configure the wifi correctly for the country you're in.
AAWG_COUNTRY_CODE=GB


## Override Wifi channel
## 2.4GHz channels only (1-13). Use 1, 6 or 11, whichever is least congested
## where you usually drive. On the Pi Zero 2 W the default is channel 1.
## WARNING: do not set this on a Pi 3A+ or Pi 4 image. Those boards run a 5GHz
## access point on channel 36, and forcing a 2.4GHz channel here leaves hostapd
## with hw_mode=a and a channel it cannot use, which takes the wifi down
## completely and leaves the dongle unreachable.
#AAWG_WIFI_CHANNEL=1


## Set the connection strategy to use
## 0 - Dongle mode. Waits for both dongle and headunit bluetooth connections and then starts the wifi and usb connections.
## 1 - Phone first (default). Waits for the phone bluetooth and wifi to connect first, and then starts the usb connection.
## 2 - Usb first. Waits for the usb to connect first, and then starts the bluetooth and wifi connection with phone.
AAWG_CONNECTION_STRATEGY=1


## Override bluetooth name suffix
## Set a custom suffix to replace unique id used in "WirelessAADongle-<suffix>" or "AndroidAuto-Dongle-<suffix>"
#AAWG_UNIQUE_NAME_SUFFIX=



######## Advanced Configuration ########

## Override Wifi Password
## Set a custom password for the wifi network.
## This is usually only required when you're debugging the dongle. Not recommended for normal use.
#AAWG_WIFI_PASSWORD=ConnectAAWirelessDongle


## Enable SSH
## Enable SSH server to login and access the dongle's command prompt.
## This is usually only required when you're debugging the dongle. Not recommended for normal use.
#AAWG_ENABLE_SSH=1


## Heartbeat logging interval, in seconds
## How often /usr/bin/aawgd-heartbeat writes a telemetry line to /persist/aawgd.log.
## Default is 8, changed from 45 on 3 Aug 2026. Every drive on this dongle is a
## diagnostic drive, and four captures in a row shipped at 45s because this line
## stayed commented out. At 45s a single track is only three or four samples wide
## and a whole session collapse is three, so anything happening at a track change
## or during a fast failure is invisible. The log flush is rate limited separately,
## so a shorter interval here does not multiply SD card writes.
##
## Raise it if a capture ever needs to run long and quiet; there is no reason to
## on a normal drive, since 512M of persist holds days at 8s.
#AAWG_HEARTBEAT_INTERVAL=8
